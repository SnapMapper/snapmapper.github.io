<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Local-only policy. connect-src 'none' stops fetch, XHR, WebSocket, EventSource and
    sendBeacon from this page; every other resource type is limited to this folder.
    The service worker is a separate script and only re-reads this folder's files.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mapper Log">
  <meta name="format-detection" content="telephone=no">
  <title>Mapper Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/boot-check.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <nav id="nav" class="nav"></nav>
  <main id="app" class="app">
    <p class="loading">Loading…</p>
  </main>
  <noscript>Mapper Log needs JavaScript.</noscript>
</body>
</html>
